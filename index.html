<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS PRO | الكاشير</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/theme.css">
</head>

<body>
<script src="assets/js/auth-guard.js"></script>

<header class="top-bar">
  <h1>POS PRO</h1>
  <nav>
    <a href="index.html" class="active">الكاشير</a>
    <a href="pages/products.html">الأصناف</a>
    <a href="pages/reports.html">التقارير</a>
    <a href="pages/settings.html">الإعدادات</a>
    <button onclick="logout()">خروج</button>
  </nav>
</header>

<main class="pos-layout">

  <section class="products-panel">
    <input placeholder="بحث بالاسم أو الباركود" oninput="searchProduct(this.value)">
    <div id="productsGrid"></div>
  </section>

  <section class="invoice-panel">
    <h2>الفاتورة</h2>
    <div id="invoiceItems"></div>

    <div class="total-box">
      الإجمالي: <strong id="total">0</strong> ج
    </div>

    <button onclick="saveInvoice()">حفظ الفاتورة</button>
    <button onclick="clearInvoice()">تفريغ</button>
  </section>

</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/barcode.js"></script>
<script src="assets/js/cashier.js"></script>
</body>
</html>
