<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>POS Super Pro | الكاشير</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="app-header">
  <div class="logo">🧾 POS Super Pro</div>

  <nav class="nav">
    <a href="index.html" class="active">الكاشير</a>
    <a href="pages/products.html">الأصناف</a>
    <a href="pages/reports.html">التقارير</a>
    <a href="pages/settings.html">الإعدادات</a>
  </nav>

  <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
</header>

<!-- ================= MAIN ================= -->
<main class="container">

  <!-- ===== البحث ===== -->
  <section class="card">
    <h2>🔍 بحث / باركود</h2>
    <input
      id="searchInput"
      placeholder="اسم الصنف أو الباركود"
      onkeyup="searchProduct(this.value)"
    >
  </section>

  <!-- ===== المنتجات ===== -->
  <section class="card">
    <h2>📦 المنتجات</h2>
    <div id="productsGrid" class="products-grid">
      <!-- يتم التحميل تلقائياً -->
    </div>
  </section>

  <!-- ===== الفاتورة ===== -->
  <section class="card invoice">
    <h2>🧮 الفاتورة</h2>

    <div id="invoiceItems" class="invoice-items">
      <small>لم يتم إضافة أصناف بعد</small>
    </div>

    <div class="invoice-total">
      <span>الإجمالي</span>
      <strong id="total">0 ج</strong>
    </div>

    <div class="invoice-actions">
      <button class="btn-primary" onclick="saveInvoice()">💾 حفظ</button>
      <button class="btn-danger" onclick="clearInvoice()">🗑️ تفريغ</button>
    </div>
  </section>

</main>

<!-- ================= AUDIO ================= -->
<audio id="beepSound" src="assets/sounds/beep.mp3"></audio>

<!-- ================= JS ================= -->
<script src="assets/js/theme.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/cashier.js"></script>
<script src="assets/js/barcode.js"></script>

<!-- ================= SW ================= -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>
