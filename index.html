<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
  <meta charset="UTF-8">
  <title>POS Super Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>

<body>

<header class="top-bar">
  <span>POS Super Pro</span>
  <nav>
    <button onclick="goPage('pages/products.html')">الأصناف</button>
    <button onclick="goPage('pages/reports.html')">التقارير</button>
    <button onclick="goPage('pages/settings.html')">الإعدادات</button>
  </nav>
</header>

<main class="container">

  <!-- البحث -->
  <input id="search" type="text" placeholder="بحث بالاسم أو الباركود" oninput="renderProducts()">

  <!-- المنتجات -->
  <section class="card">
    <h2>المنتجات</h2>
    <div id="productsGrid" class="products-grid"></div>
  </section>

  <!-- الفاتورة -->
  <section class="card">
    <h2>الفاتورة</h2>
    <div id="cart"></div>
    <h3>الإجمالي: <span id="total">0</span> ج</h3>

    <button class="btn-success" onclick="saveInvoice()">💾 حفظ</button>
    <button class="btn-danger" onclick="clearCart()">🗑️ تفريغ</button>
  </section>

</main>

<script src="assets/js/cashier.js"></script>
<script src="assets/js/theme.js"></script>
<script>
function saveSale(total, itemsCount) {
  const sales = JSON.parse(localStorage.getItem("sales")) || [];

  sales.push({
    total: total,
    items: itemsCount,
    date: new Date().toISOString()
  });

  localStorage.setItem("sales", JSON.stringify(sales));
}
</script>
<script>
function completeSale() {
  const total = Number(document.getElementById("total").innerText);
  const itemsCount = document.querySelectorAll(".invoice-item").length;

  saveSale(total, itemsCount);

  alert("تم حفظ الفاتورة ✔️");
}
</script>  
  <script>
function completeSale() {
  const totalEl = document.getElementById("totalAmount");
  if (!totalEl) {
    alert("عنصر الإجمالي غير موجود");
    return;
  }

  const total = Number(totalEl.innerText);
  if (total <= 0) {
    alert("الإجمالي صفر");
    return;
  }

  const sales = JSON.parse(localStorage.getItem("sales")) || [];

  sales.push({
    total: total,
    date: new Date().toISOString()
  });

  localStorage.setItem("sales", JSON.stringify(sales));

  alert("تم تسجيل البيع ✔️");
}
</script>
</body>
</html>
