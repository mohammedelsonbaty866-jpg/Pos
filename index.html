<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>POS Super Pro | الكاشير</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>

<body>

<!-- الهيدر بيتحقن تلقائي من layout.js -->

<main class="page">

  <!-- ===== البحث ===== -->
  <div class="card">
    <h2>🔍 بحث / باركود</h2>
    <input
      id="searchInput"
      placeholder="اكتب اسم الصنف أو الباركود"
      onkeyup="searchProduct(this.value)"
    >
  </div>

  <!-- ===== المنتجات ===== -->
  <div class="card">
    <h2>🧾 المنتجات</h2>
    <div id="productsGrid" class="grid">
      <!-- يتم التحميل من products.js -->
    </div>
  </div>

  <!-- ===== الفاتورة ===== -->
  <div class="card">
    <h2>🧮 الفاتورة</h2>

    <div id="invoiceItems">
      <small>لم يتم إضافة أصناف بعد</small>
    </div>

    <hr>

    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>الإجمالي:</strong>
      <strong id="total">0 ج</strong>
    </div>

    <div style="margin-top:10px;display:flex;gap:10px">
      <button class="btn-primary" onclick="saveInvoice()">💾 حفظ</button>
      <button onclick="clearInvoice()">🗑️ تفريغ</button>
    </div>
  </div>

</main>

<!-- ===== الأصوات ===== -->
<audio id="beepSound" src="assets/sounds/beep.mp3"></audio>

<!-- ===== JS ===== -->
<script src="assets/js/theme.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/cashier.js"></script>
<script src="assets/js/barcode.js"></script>

<!-- Service Worker -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>

</body>
</html>
