<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>POS Super Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="top-bar">
  <h1>POS Super Pro</h1>

  <div class="top-actions">
    <button onclick="toggleTheme()">🌓</button>
    <a href="pages/settings.html">⚙️</a>
    <button onclick="logout()">⏻</button>
  </div>
</header>

<!-- ================= NAV ================= -->
<nav class="main-nav">
  <button class="active">🧾 الكاشير</button>
  <a href="pages/products.html">📦 الأصناف</a>
  <a href="pages/reports.html">📊 التقارير</a>
</nav>

<!-- ================= MAIN ================= -->
<main class="pos-layout">

  <!-- ===== PRODUCTS ===== -->
  <section class="products-panel">
    <h2>المنتجات</h2>

    <input
      type="text"
      placeholder="بحث بالاسم أو الباركود"
      onkeyup="searchProduct(this.value)"
    >

    <button class="scan-btn" onclick="openBarcodeScanner()">
      📷 مسح باركود
    </button>

    <div id="productsGrid"></div>
  </section>

  <!-- ===== INVOICE ===== -->
  <section class="invoice-panel">
    <h2>الفاتورة</h2>

    <div id="invoiceItems"></div>

    <div class="total-box">
      <span>الإجمالي</span>
      <strong id="total">0 ج</strong>
    </div>

    <div class="actions">
      <button class="btn-save" onclick="saveInvoice()">حفظ</button>
      <button class="btn-clear" onclick="clearInvoice()">تفريغ</button>
    </div>
  </section>

</main>

<!-- ================= FOOTER ================= -->
<footer>
  POS Super Pro ©
</footer>

<!-- ================= BARCODE CAMERA ================= -->
<div id="barcodeOverlay" class="barcode-overlay">
  <div class="scanner-box">
    <video id="barcodeVideo"></video>
    <button onclick="closeScanner()">إغلاق</button>
  </div>
</div>

<!-- ================= SOUND ================= -->
<audio id="beepSound" src="assets/sounds/beep.mp3"></audio>

<!-- ================= JS ================= -->
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/cashier.js"></script>
<script src="assets/js/barcode.js"></script>
<script src="assets/js/settings.js"></script>

</body>
</html>
