<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نقطة بيع | POS Pro</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d6efd" />

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/theme.css" />

</head>
<body>

    <!-- Top Bar -->
    <header class="top-bar">
        <h1>🧾 الكاشير</h1>
        <div class="top-actions">
            <button onclick="toggleTheme()">🌗</button>
            <button onclick="logout()">تسجيل خروج</button>
        </div>
    </header>

    <!-- Cashier Layout -->
    <main class="cashier-container">

        <!-- Search -->
        <section class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 ابحث بالاسم أو الباركود"
                oninput="searchProduct(this.value)"
            />
        </section>

        <!-- Products List -->
        <section class="products-list" id="productsList">
            <!-- منتجات -->
        </section>

        <!-- Cart -->
        <section class="cart">
            <h2>🛒 الفاتورة</h2>
            <div id="cartItems"></div>

            <div class="total">
                الإجمالي: <span id="totalPrice">0</span> ج
            </div>

            <button class="pay-btn" onclick="checkout()">💰 إتمام البيع</button>
        </section>

    </main>

    <!-- Sounds -->
    <audio id="beepSound" src="assets/sounds/beep.mp3"></audio>

    <!-- JS -->
    <script src="assets/js/auth-guard.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/barcode.js"></script>
    <script src="assets/js/cashier.js"></script>
    <script src="assets/js/settings.js"></script>

    <script>
        requireAuth();
        loadProducts();
    </script>

</body>
</html>
