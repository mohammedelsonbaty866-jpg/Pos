<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>POS Super Pro</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d6efd" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/theme.css" />

  <!-- Icons -->
  <link rel="icon" href="assets/icons/icon-192.png" />
</head>

<body class="light">

  <!-- ================= HEADER ================= -->
  <header class="app-header">
    <div class="logo">🧾 POS Super Pro</div>
    <div class="header-actions">
      <button id="themeToggle" title="الوضع الليلي">🌙</button>
    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main class="cashier-page">

    <!-- Search & Barcode -->
    <section class="search-section">
      <input
        type="text"
        id="searchInput"
        placeholder="🔍 بحث بالاسم أو الباركود"
      />
      <button id="barcodeBtn" title="قراءة باركود">📷</button>
    </section>

    <!-- Products -->
    <section class="products-section">
      <h2>📦 الأصناف</h2>
      <div id="productsList" class="products-grid">
        <!-- المنتجات تظهر هنا -->
      </div>
    </section>

    <!-- Cart -->
    <aside class="cart-section">
      <h2>🛒 الفاتورة</h2>

      <ul id="cartItems" class="cart-items"></ul>

      <div class="cart-summary">
        <div>
          الإجمالي:
          <strong><span id="totalPrice">0</span> ج</strong>
        </div>
        <button id="payBtn" class="pay-btn">💰 إتمام البيع</button>
      </div>
    </aside>

  </main>

  <!-- ================= NAV ================= -->
  <nav class="bottom-nav">
    <a href="index.html" class="active">🏠 الكاشير</a>
    <a href="pages/products.html">📦 الأصناف</a>
    <a href="pages/reports.html">📊 التقارير</a>
    <a href="pages/settings.html">⚙️ الإعدادات</a>
  </nav>

  <!-- ================= JS ================= -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cashier.js"></script>
  <script src="assets/js/barcode.js"></script>

  <!-- Theme -->
  <script>
    const toggle = document.getElementById("themeToggle");

    toggle.onclick = () => {
      document.body.classList.toggle("dark");
      document.body.classList.toggle("light");

      localStorage.setItem(
        "theme",
        document.body.classList.contains("dark") ? "dark" : "light"
      );
    };

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      document.body.classList.remove("light");
      document.body.classList.add("dark");
    }
  </script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

</body>
</html>
