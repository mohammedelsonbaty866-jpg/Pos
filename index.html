<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>POS | الكاشير</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/theme.css">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="top-bar">
  <h1>نظام نقاط بيع</h1>

  <nav>
    <a href="index.html" class="active">الكاشير</a>
    <a href="pages/products.html">الأصناف</a>
    <a href="pages/reports.html">التقارير</a>
    <a href="pages/settings.html">الإعدادات</a>
  </nav>

  <button onclick="toggleTheme()" title="تغيير الوضع">🌓</button>
</header>

<!-- ===== MAIN ===== -->
<main class="pos-layout">

  <!-- المنتجات -->
  <section class="products-panel">
    <h2>المنتجات</h2>

    <input
      type="text"
      id="searchInput"
      placeholder="بحث بالاسم أو الباركود..."
      onkeyup="searchProduct(this.value)"
    >

    <div id="productsGrid"></div>
  </section>

  <!-- الفاتورة -->
  <section class="invoice-panel">
    <h2>الفاتورة</h2>

    <div id="invoiceItems"></div>

    <div class="total-box">
      <span>الإجمالي</span>
      <strong id="total">0 ج</strong>
    </div>

    <div class="actions">
      <button class="btn-save" onclick="saveInvoice()">حفظ</button>
      <button class="btn-clear" onclick="clearInvoice()">تفريغ</button>
    </div>
  </section>

</main>

<!-- ===== FOOTER ===== -->
<footer>
  POS Pro © 2025
</footer>

<!-- ===== SCRIPTS ===== -->
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/cashier.js"></script>
<script src="assets/js/barcode.js"></script>
<script src="assets/js/settings.js"></script>

<!-- ===== SERVICE WORKER ===== -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>
