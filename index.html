<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>POS Super Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>

<header class="top-bar">
  <h2>🧾 الكاشير</h2>
  <div>
    <button onclick="toggleTheme()">🌙</button>
    <button onclick="startBarcode()">📷</button>
    <a href="pages/settings.html" class="btn">⚙️</a>
  </div>
</header>

<main class="pos-layout">

  <section class="products-panel">
    <h3>المنتجات</h3>
    <div id="productsList" class="products-grid"></div>
  </section>

  <section class="invoice-panel">
    <h3>الفاتورة</h3>
    <ul id="cartList"></ul>

    <div class="total-box">
      الإجمالي: <span id="total">0</span> جنيه
    </div>

    <button class="pay-btn" onclick="checkout()">💵 إتمام البيع</button>
  </section>

</main>

<!-- نافذة الكاميرا -->
<div id="barcodeModal" class="modal">
  <video id="camera" autoplay></video>
  <button onclick="stopBarcode()">❌ إغلاق</button>
</div>

<audio id="beep" src="assets/sounds/beep.mp3"></audio>

<script src="assets/js/data.js"></script>
<script src="assets/js/cashier.js"></script>
<script src="assets/js/barcode.js"></script>
<script src="assets/js/settings.js"></script>

</body>
</html>
