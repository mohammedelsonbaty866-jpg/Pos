<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Pro - الكاشير</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d6efd" />

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/theme.css" />

  <!-- Icons -->
  <link rel="icon" href="assets/icons/icon-192.png" />

</head>
<body>

  <!-- الهيدر -->
  <header class="top-bar">
    <h1>🧾 الكاشير</h1>

    <div class="top-actions">
      <button id="themeToggle">🌙</button>
      <button onclick="goSettings()">⚙️ الإعدادات</button>
      <button onclick="logout()">🚪 خروج</button>
    </div>
  </header>

  <!-- البحث -->
  <section class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="ابحث بالاسم أو الباركود"
      autofocus
    />
    <button onclick="openCamera()">📷</button>
  </section>

  <!-- المنتجات -->
  <section class="products" id="productsList">
    <!-- يتم تعبئتها تلقائي -->
  </section>

  <!-- الفاتورة -->
  <aside class="cart">
    <h2>الفاتورة</h2>
    <ul id="cartItems"></ul>

    <div class="total">
      الإجمالي: <span id="totalPrice">0</span> ج
    </div>

    <button class="pay-btn" onclick="completeSale()">
      💳 إتمام البيع
    </button>
  </aside>

  <!-- صوت الباركود -->
  <audio id="beepSound" src="assets/sounds/beep.mp3"></audio>

  <!-- JS -->
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/barcode.js"></script>
  <script src="assets/js/cashier.js"></script>
  <script src="assets/js/settings.js"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

</body>
</html>
