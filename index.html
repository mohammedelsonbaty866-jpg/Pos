<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Super Pro</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d6efd" />

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/theme.css" />

  <!-- Icons -->
  <link rel="icon" href="assets/icons/icon-192.png" />
</head>

<body class="light">

  <!-- Header -->
  <header class="top-bar">
    <h1>🧾 POS Super Pro</h1>
    <button id="themeToggle">🌙</button>
  </header>

  <!-- Main Cashier -->
  <main class="cashier-container">

    <!-- Search -->
    <section class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 بحث بالاسم أو الباركود">
      <button id="scanBarcode">📷</button>
    </section>

    <!-- Products List -->
    <section class="products-list" id="productsList">
      <!-- يتم تحميل الأصناف هنا -->
    </section>

    <!-- Cart -->
    <section class="cart">
      <h2>🛒 الفاتورة</h2>
      <ul id="cartItems"></ul>
      <div class="total">
        الإجمالي: <span id="totalPrice">0</span> ج
      </div>
      <button id="payBtn" class="pay-btn">💰 دفع</button>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html">🏠 الكاشير</a>
    <a href="pages/products.html">📦 الأصناف</a>
    <a href="pages/reports.html">📊 التقارير</a>
    <a href="pages/settings.html">⚙️ الإعدادات</a>
  </nav>

  <!-- JS -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cashier.js"></script>
  <script src="assets/js/barcode.js"></script>

  <!-- Theme Script -->
  <script>
    const toggle = document.getElementById("themeToggle");
    toggle.onclick = () => {
      document.body.classList.toggle("dark");
      document.body.classList.toggle("light");
      localStorage.setItem(
        "theme",
        document.body.classList.contains("dark") ? "dark" : "light"
      );
    };

    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.remove("light");
      document.body.classList.add("dark");
    }
  </script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

</body>
</html>
