<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Super Pro</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d6efd" />

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/theme.css" />

</head>
<body class="light">

  <!-- HEADER -->
  <header class="header">
    <h1>نقطة البيع</h1>
    <div class="header-actions">
      <button onclick="toggleTheme()">🌙</button>
      <button onclick="goSettings()">⚙️</button>
    </div>
  </header>

  <!-- SEARCH -->
  <section class="search-section">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="ابحث بالاسم أو الباركود"
      autofocus
    />
  </section>

  <!-- PRODUCTS -->
  <section class="products-section" id="productsList">
    <!-- المنتجات -->
  </section>

  <!-- CART -->
  <section class="cart-section">
    <h2>الفاتورة</h2>
    <ul id="cartList"></ul>

    <div class="total">
      الإجمالي: <span id="totalPrice">0</span> جنيه
    </div>

    <button class="pay-btn" onclick="completeSale()">
      إتمام البيع
    </button>
  </section>

  <!-- SOUND -->
  <audio id="beepSound" src="assets/sounds/beep.mp3"></audio>

  <!-- JS -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/barcode.js"></script>
  <script src="assets/js/cashier.js"></script>
  <script src="assets/js/settings.js"></script>

  <!-- SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

</body>
</html>
