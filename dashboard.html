<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Super Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/theme.css">
</head>

<body>
<header>
  <h1>POS Super Pro</h1>
  <nav>
    <a href="dashboard.html">الكاشير</a>
    <a href="products.html">الأصناف</a>
    <a href="reports.html">التقارير</a>
    <a href="settings.html">الإعدادات</a>
    <button onclick="logout()">خروج</button>
  </nav>
</header>

<main class="pos">
  <section class="products">
    <input placeholder="بحث / باركود" onkeyup="searchProduct(this.value)">
    <div id="productsGrid"></div>
  </section>

  <section class="invoice">
    <h3>الفاتورة</h3>
    <div id="invoiceItems"></div>
    <h2 id="total">0 ج</h2>
    <button onclick="saveInvoice()">حفظ</button>
    <button onclick="clearInvoice()">تفريغ</button>
  </section>
</main>

<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cashier.js"></script>
<script src="assets/js/barcode.js"></script>
</body>
</html>
