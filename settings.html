<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الإعدادات | POS Super Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="top-bar">
  <div class="left">
    <h1>⚙️ الإعدادات</h1>
  </div>

  <div class="right">
    <button class="icon-btn" onclick="goCashier()">⬅️ الكاشير</button>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main class="settings-layout">

  <!-- ===== GENERAL ===== -->
  <section class="settings-card">
    <h2>⚡ الإعدادات العامة</h2>

    <div class="setting-item">
      <span>الوضع الليلي</span>
      <button onclick="toggleTheme()" class="btn">تبديل</button>
    </div>

    <div class="setting-item">
      <span>صوت الباركود</span>
      <button onclick="toggleBeep()" class="btn">تشغيل / إيقاف</button>
    </div>
  </section>

  <!-- ===== ACCOUNT ===== -->
  <section class="settings-card">
    <h2>👤 الحساب</h2>

    <div class="setting-item">
      <span>اسم المستخدم</span>
      <strong id="currentUser">---</strong>
    </div>

    <div class="setting-item">
      <button class="btn danger" onclick="logout()">تسجيل الخروج</button>
    </div>
  </section>

  <!-- ===== SYSTEM ===== -->
  <section class="settings-card">
    <h2>🛠️ النظام</h2>

    <div class="setting-item">
      <button class="btn" onclick="clearData()">مسح البيانات</button>
    </div>

    <div class="setting-item">
      <button class="btn" onclick="reloadApp()">إعادة تشغيل التطبيق</button>
    </div>
  </section>

</main>

<!-- ===== FOOTER ===== -->
<footer class="app-footer">
  POS Super Pro © 2025
</footer>

<!-- ===== JS ===== -->
<script src="../assets/js/auth-guard.js"></script>
<script src="../assets/js/settings.js"></script>

</body>
</html>
