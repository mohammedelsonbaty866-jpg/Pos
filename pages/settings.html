<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الإعدادات | POS Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="top-bar">
  <h1>⚙️ الإعدادات</h1>
  <nav>
    <a href="../index.html">⬅ رجوع للكاشير</a>
  </nav>
</header>

<!-- ===== MAIN ===== -->
<main class="settings-page">

  <!-- ===== المظهر ===== -->
  <section class="card">
    <h2>🎨 المظهر</h2>

    <label class="switch-row">
      <span>الوضع الداكن</span>
      <input type="checkbox" id="darkModeToggle">
    </label>
  </section>

  <!-- ===== الصوت ===== -->
  <section class="card">
    <h2>🔊 الصوت</h2>

    <label class="switch-row">
      <span>صوت الباركود</span>
      <input type="checkbox" id="barcodeSoundToggle">
    </label>
  </section>

  <!-- ===== البيانات ===== -->
  <section class="card danger">
    <h2>🗑️ إدارة البيانات</h2>

    <button class="btn-danger" onclick="resetData()">
      مسح كل البيانات
    </button>

    <p class="hint">
      ⚠️ سيتم حذف الفواتير والأصناف نهائيًا
    </p>
  </section>

</main>

<!-- ===== FOOTER ===== -->
<footer>
  POS Super Pro © 2025
</footer>

<!-- ===== JS ===== -->
<script src="../assets/js/auth-guard.js"></script>
<script src="../assets/js/settings.js"></script>

</body>
</html>
