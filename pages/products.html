<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الأصناف | POS PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<script src="../assets/js/auth-guard.js"></script>

<header class="top-bar">
  <h1>الأصناف</h1>
  <nav>
    <a href="../index.html">الكاشير</a>
    <a class="active">الأصناف</a>
    <a href="reports.html">التقارير</a>
    <a href="settings.html">الإعدادات</a>
  </nav>
</header>

<main style="padding:10px">
  <h3>إضافة صنف</h3>

  <input id="pName" placeholder="اسم الصنف">
  <input id="pPrice" type="number" placeholder="السعر">
  <input id="pBarcode" placeholder="باركود (اختياري)">
  <button onclick="addProduct()">إضافة</button>

  <h3>قائمة الأصناف</h3>
  <table width="100%" border="1">
    <thead>
      <tr>
        <th>#</th>
        <th>الصنف</th>
        <th>السعر</th>
        <th>باركود</th>
        <th>حذف</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/products.js"></script>
<script>
function addProduct(){
  products.push({
    name: pName.value,
    price: Number(pPrice.value),
    barcode: pBarcode.value
  });
  saveAll();
  render();
}

function remove(i){
  products.splice(i,1);
  saveAll();
  render();
}

function render(){
  list.innerHTML="";
  products.forEach((p,i)=>{
    list.innerHTML+=`
      <tr>
        <td>${i+1}</td>
        <td>${p.name}</td>
        <td>${p.price}</td>
        <td>${p.barcode||""}</td>
        <td><button onclick="remove(${i})">X</button></td>
      </tr>`;
  });
}
render();
</script>

</body>
</html>
