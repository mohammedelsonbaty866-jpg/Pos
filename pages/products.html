<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إدارة الأصناف | POS Super Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
</head>

<body>

<header class="app-header">
  <div class="logo">📦 الأصناف</div>
  <nav class="nav">
    <a href="../index.html">الكاشير</a>
    <a href="products.html" class="active">الأصناف</a>
    <a href="reports.html">التقارير</a>
    <a href="settings.html">الإعدادات</a>
  </nav>
</header>

<main class="container">

  <section class="card">
    <h2>➕ إضافة صنف</h2>

    <input id="pName" placeholder="اسم الصنف">
    <input id="pPrice" type="number" placeholder="السعر">
    <input id="pBarcode" placeholder="الباركود">

    <button class="btn-primary" onclick="addProduct()">إضافة</button>
  </section>

  <section class="card">
    <h2>📋 قائمة الأصناف</h2>
    <table class="table">
      <thead>
        <tr>
          <th>الاسم</th>
          <th>السعر</th>
          <th>باركود</th>
          <th>حذف</th>
        </tr>
      </thead>
      <tbody id="productsTable"></tbody>
    </table>
  </section>

</main>

<script src="../assets/js/data.js"></script>
<script>
function loadProducts() {
  const products = JSON.parse(localStorage.getItem("products") || "[]");
  const table = document.getElementById("productsTable");
  table.innerHTML = "";

  products.forEach((p, i) => {
    table.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>${p.price}</td>
        <td>${p.barcode || "-"}</td>
        <td><button onclick="deleteProduct(${i})">❌</button></td>
      </tr>`;
  });
}

function addProduct() {
  const products = JSON.parse(localStorage.getItem("products") || "[]");

  products.push({
    name: pName.value,
    price: Number(pPrice.value),
    barcode: pBarcode.value
  });

  localStorage.setItem("products", JSON.stringify(products));
  loadProducts();

  pName.value = pPrice.value = pBarcode.value = "";
}

function deleteProduct(i) {
  const products = JSON.parse(localStorage.getItem("products"));
  products.splice(i, 1);
  localStorage.setItem("products", JSON.stringify(products));
  loadProducts();
}

loadProducts();
</script>

</body>
</html>
