<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الأصناف | POS Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="top-bar">
  <h1>📦 إدارة الأصناف</h1>
  <nav>
    <a href="../index.html">⬅ رجوع للكاشير</a>
  </nav>
</header>

<!-- ===== MAIN ===== -->
<main class="products-page">

  <!-- إضافة صنف -->
  <section class="card">
    <h2>➕ إضافة صنف جديد</h2>

    <label>اسم الصنف</label>
    <input type="text" id="productName" placeholder="مثال: سكر 1ك">

    <label>السعر</label>
    <input type="number" id="productPrice" placeholder="السعر بالجنيه">

    <label>الباركود (اختياري)</label>
    <input type="text" id="productBarcode" placeholder="باركود الصنف">

    <button onclick="addProduct()" class="btn-primary">
      💾 إضافة الصنف
    </button>
  </section>

  <!-- قائمة الأصناف -->
  <section class="card">
    <h2>📋 قائمة الأصناف</h2>

    <input 
      type="text" 
      placeholder="🔍 بحث بالاسم أو الباركود"
      onkeyup="searchProducts(this.value)"
    >

    <table class="products-table">
      <thead>
        <tr>
          <th>#</th>
          <th>الصنف</th>
          <th>السعر</th>
          <th>الباركود</th>
          <th>حذف</th>
        </tr>
      </thead>
      <tbody id="productsTable"></tbody>
    </table>
  </section>

</main>

<!-- ===== FOOTER ===== -->
<footer>
  POS Super Pro © 2025
</footer>

<!-- ===== JS ===== -->
<script src="../assets/js/auth-guard.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/products.js"></script>

</body>
</html>
