<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إدارة الأصناف | POS Super Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>

<body>

<header class="top-bar">
  <button onclick="goCashier()">⬅️</button>
  <span>إدارة الأصناف</span>
  <button onclick="toggleTheme()">🌙</button>
</header>

<main class="container">

  <!-- إضافة صنف -->
  <section class="card">
    <h2>➕ إضافة صنف جديد</h2>

    <input id="pName" type="text" placeholder="اسم الصنف">
    <input id="pPrice" type="number" placeholder="السعر">
    <input id="pBarcode" type="text" placeholder="الباركود">

    <button class="btn-success" onclick="addProduct()">💾 حفظ الصنف</button>
  </section>

  <!-- قائمة الأصناف -->
  <section class="card">
    <h2>📦 كل الأصناف</h2>
    <div id="productsList" class="products-list"></div>
  </section>

</main>

<script src="../assets/js/products.js"></script>
<script src="../assets/js/theme.js"></script>

</body>
</html>
