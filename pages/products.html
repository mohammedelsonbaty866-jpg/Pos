<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إدارة الأصناف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

  <header>
    <h2>📦 إدارة الأصناف</h2>
    <a href="../index.html">⬅ رجوع للكاشير</a>
  </header>

  <!-- إضافة صنف -->
  <section>
    <form id="addProductForm">
      <input type="text" id="productName" placeholder="اسم الصنف" required>
      <input type="number" id="productPrice" placeholder="السعر" required>
      <input type="text" id="productBarcode" placeholder="الباركود (اختياري)">
      <button type="submit">➕ إضافة</button>
    </form>
  </section>

  <!-- البحث -->
  <section>
    <input
      type="text"
      id="searchProduct"
      placeholder="🔍 بحث بالاسم أو الباركود"
    >
  </section>

  <!-- جدول الأصناف -->
  <section>
    <table border="1" width="100%">
      <thead>
        <tr>
          <th>الاسم</th>
          <th>السعر</th>
          <th>الباركود</th>
          <th>حذف</th>
        </tr>
      </thead>
      <tbody id="productsTable"></tbody>
    </table>
  </section>

  <!-- JS -->
  <script src="../assets/js/products.js"></script>

</body>
</html>
