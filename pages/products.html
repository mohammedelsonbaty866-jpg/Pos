<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إدارة الأصناف | POS Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/theme.css">

</head>
<body>

<!-- ===== HEADER ===== -->
<header class="top-bar">
  <h1>إدارة الأصناف</h1>
  <nav>
    <a href="../index.html">الكاشير</a>
    <a href="products.html" class="active">الأصناف</a>
    <a href="reports.html">التقارير</a>
    <a href="settings.html">الإعدادات</a>
  </nav>
</header>

<!-- ===== MAIN ===== -->
<main class="page-container">

  <!-- إضافة صنف -->
  <section class="card">
    <h2>➕ إضافة صنف جديد</h2>

    <div class="form-grid">
      <input id="productName" type="text" placeholder="اسم الصنف">
      <input id="productPrice" type="number" placeholder="السعر">
      <input id="productBarcode" type="text" placeholder="الباركود (اختياري)">

      <button onclick="addProduct()" class="btn-primary">
        إضافة الصنف
      </button>
    </div>
  </section>

  <!-- قائمة الأصناف -->
  <section class="card">
    <h2>📋 قائمة الأصناف</h2>

    <input
      type="text"
      placeholder="بحث بالاسم أو الباركود..."
      onkeyup="searchProducts(this.value)"
      class="search-input"
    >

    <table class="data-table">
      <thead>
        <tr>
          <th>#</th>
          <th>الصنف</th>
          <th>السعر</th>
          <th>الباركود</th>
          <th>حذف</th>
        </tr>
      </thead>
      <tbody id="productsTable"></tbody>
    </table>
  </section>

</main>

<!-- ===== FOOTER ===== -->
<footer>
  POS Pro ©
</footer>

<!-- ===== JS ===== -->
<script src="../assets/js/data.js"></script>
<script src="../assets/js/products.js"></script>

</body>
</html>
