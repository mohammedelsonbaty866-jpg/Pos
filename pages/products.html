<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إدارة الأصناف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    body {
      font-family: Tahoma, Arial;
      background: #f4f6f9;
      margin: 0;
    }

    header {
      background: #0d6efd;
      color: #fff;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0d6efd;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }

    .delete {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <button onclick="goBack()">⬅</button>
  <h3>إدارة الأصناف</h3>
  <div>📦</div>
</header>

<div class="container">

  <div class="card">
    <h4>إضافة صنف</h4>
    <input id="name" placeholder="اسم الصنف">
    <input id="price" type="number" placeholder="السعر">
    <input id="barcode" placeholder="الباركود (اختياري)">
    <button onclick="addProduct()">➕ إضافة</button>
  </div>

  <div class="card">
    <h4>الأصناف</h4>
    <input id="search" placeholder="بحث بالاسم أو الباركود" onkeyup="renderProducts()">

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>الصنف</th>
          <th>السعر</th>
          <th>باركود</th>
          <th>حذف</th>
        </tr>
      </thead>
      <tbody id="productsTable"></tbody>
    </table>
  </div>

</div>

<script src="../assets/js/products.js"></script>

</body>
</html>
