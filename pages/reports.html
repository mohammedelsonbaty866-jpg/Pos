<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>التقارير | POS Super Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
</head>

<body>

<header class="app-header">
  <div class="logo">📊 التقارير</div>
  <nav class="nav">
    <a href="../index.html">الكاشير</a>
    <a href="products.html">الأصناف</a>
    <a href="reports.html" class="active">التقارير</a>
    <a href="settings.html">الإعدادات</a>
  </nav>
</header>

<main class="container">

  <section class="card stats">
    <div class="stat">
      <h3>💰 إجمالي المبيعات</h3>
      <strong id="sales">0 ج</strong>
    </div>

    <div class="stat">
      <h3>🧾 عدد الفواتير</h3>
      <strong id="invoices">0</strong>
    </div>

    <div class="stat">
      <h3>📦 عدد الأصناف</h3>
      <strong id="products">0</strong>
    </div>
  </section>

</main>

<script>
const invoices = JSON.parse(localStorage.getItem("invoices") || "[]");
const products = JSON.parse(localStorage.getItem("products") || "[]");

document.getElementById("invoices").innerText = invoices.length;
document.getElementById("products").innerText = products.length;

let total = 0;
invoices.forEach(i => total += i.total);
document.getElementById("sales").innerText = total + " ج";
</script>

</body>
</html>
