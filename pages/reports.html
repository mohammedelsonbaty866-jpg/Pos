<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>POS Pro | التقارير</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/theme.css">

  <!-- Auth Guard -->
  <script src="../assets/js/auth-guard.js"></script>
</head>

<body class="light">

<header class="top-bar">
  <h1>📊 التقارير</h1>
  <nav>
    <button onclick="goCashier()">⬅ الرجوع للكاشير</button>
  </nav>
</header>

<main class="reports-layout">

  <!-- ملخص -->
  <section class="summary">
    <div class="card">
      <h3>عدد الفواتير</h3>
      <span id="totalInvoices">0</span>
    </div>

    <div class="card">
      <h3>إجمالي المبيعات</h3>
      <span id="totalSales">0 ج</span>
    </div>

    <div class="card">
      <h3>عدد الأصناف المباعة</h3>
      <span id="totalItems">0</span>
    </div>
  </section>

  <!-- جدول الفواتير -->
  <section class="table-section">
    <h2>سجل الفواتير</h2>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>التاريخ</th>
          <th>الإجمالي</th>
          <th>عدد الأصناف</th>
        </tr>
      </thead>
      <tbody id="reportsTable"></tbody>
    </table>
  </section>

</main>

<footer>
  POS Super Pro ©
</footer>

<!-- JS -->
<script src="../assets/js/reports.js"></script>
</body>
</html>
