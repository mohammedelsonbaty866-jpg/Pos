<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>التقارير</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    body {
      font-family: Tahoma, Arial;
      background: #f4f6f9;
      margin: 0;
    }

    header {
      background: #0d6efd;
      color: #fff;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }

    .invoice {
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<header>
  <button onclick="goBack()">⬅</button>
  <h3>التقارير</h3>
  <div>📊</div>
</header>

<div class="container">

  <div class="card">
    <h4>ملخص</h4>
    <p>عدد الفواتير: <strong id="count">0</strong></p>
    <p>إجمالي المبيعات: <strong id="sum">0</strong></p>
  </div>

  <div class="card">
    <h4>تفاصيل الفواتير</h4>
    <div id="reportsList"></div>
  </div>

</div>

<script>
  const sales = JSON.parse(localStorage.getItem("sales")) || [];
  const settings = JSON.parse(localStorage.getItem("settings")) || { currency: "جنيه" };

  const countEl = document.getElementById("count");
  const sumEl = document.getElementById("sum");
  const list = document.getElementById("reportsList");

  countEl.textContent = sales.length;

  let totalSum = 0;

  sales.forEach(sale => {
    totalSum += sale.total;

    list.innerHTML += `
      <div class="invoice">
        <div>📅 ${sale.date}</div>
        <div>💰 ${sale.total} ${settings.currency}</div>
      </div>
    `;
  });

  sumEl.textContent = totalSum + " " + settings.currency;

  function goBack() {
    window.location.href = "../index.html";
  }
</script>

</body>
</html>
