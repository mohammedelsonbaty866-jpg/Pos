<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقارير | POS Super Pro</title>

  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="dark">

<!-- الهيدر -->
<header class="top-bar">
  <button class="icon-btn" onclick="history.back()">⬅</button>
  <h1>التقارير</h1>
  <button class="icon-btn">🌙</button>
</header>

<main class="container">

  <!-- كارت التقارير -->
  <section class="card">

    <h2 class="card-title">📊 تقارير المبيعات</h2>

    <div class="list">

      <div class="list-item">
        <span>مبيعات اليوم</span>
        <strong>0 ج</strong>
      </div>

      <div class="list-item">
        <span>عدد الفواتير</span>
        <strong>0</strong>
      </div>

      <div class="list-item">
        <span>إجمالي الشهر</span>
        <strong>0 ج</strong>
      </div>

      <div class="list-item">
        <span>أعلى صنف</span>
        <strong>—</strong>
      </div>

    </div>

  </section>

</main>

<footer class="footer">
  POS Super Pro © 2025
</footer>
<script>
function loadReports() {
  const sales = JSON.parse(localStorage.getItem("sales")) || [];
  const today = new Date().toDateString();

  let todayTotal = 0;
  let todayCount = 0;
  let monthTotal = 0;

  sales.forEach(sale => {
    const saleDate = new Date(sale.date);

    // مبيعات اليوم
    if (saleDate.toDateString() === today) {
      todayTotal += sale.total;
      todayCount++;
    }

    // مبيعات الشهر
    const now = new Date();
    if (
      saleDate.getMonth() === now.getMonth() &&
      saleDate.getFullYear() === now.getFullYear()
    ) {
      monthTotal += sale.total;
    }
  });

  document.getElementById("todaySales").innerText = todayTotal + " ج";
  document.getElementById("salesCount").innerText = todayCount;
  document.getElementById("monthSales").innerText = monthTotal + " ج";
}

loadReports();
</script>
</body>
</html>
<div class="list-item">
  <span>مبيعات اليوم</span>
  <strong id="todaySales">0 ج</strong>
</div>

<div class="list-item">
  <span>عدد الفواتير</span>
  <strong id="salesCount">0</strong>
</div>

<div class="list-item">
  <span>إجمالي الشهر</span>
  <strong id="monthSales">0 ج</strong>
</div>
<script>
function loadReports() {
  const sales = JSON.parse(localStorage.getItem("sales")) || [];

  let todayTotal = 0;
  let count = 0;

  const today = new Date().toDateString();

  sales.forEach(sale => {
    const d = new Date(sale.date);
    if (d.toDateString() === today) {
      todayTotal += sale.total;
      count++;
    }
  });

  document.getElementById("todaySales").innerText = todayTotal + " ج";
  document.getElementById("salesCount").innerText = count;
}

window.onload = loadReports;
</script>
