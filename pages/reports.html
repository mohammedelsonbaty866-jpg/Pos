<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>التقارير | POS Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="top-bar">
  <h1>📊 التقارير</h1>
  <nav>
    <a href="../index.html">⬅ رجوع للكاشير</a>
  </nav>
</header>

<!-- ===== MAIN ===== -->
<main class="reports-page">

  <!-- ملخص سريع -->
  <section class="stats-grid">

    <div class="stat-card">
      <h3>💰 إجمالي المبيعات</h3>
      <p id="totalSales">0 ج</p>
    </div>

    <div class="stat-card">
      <h3>🧾 عدد الفواتير</h3>
      <p id="totalInvoices">0</p>
    </div>

    <div class="stat-card">
      <h3>📦 عدد الأصناف المباعة</h3>
      <p id="totalItems">0</p>
    </div>

  </section>

  <!-- جدول الفواتير -->
  <section class="card">
    <h2>🧾 سجل الفواتير</h2>

    <table class="reports-table">
      <thead>
        <tr>
          <th>#</th>
          <th>التاريخ</th>
          <th>عدد الأصناف</th>
          <th>الإجمالي</th>
        </tr>
      </thead>
      <tbody id="invoicesTable"></tbody>
    </table>
  </section>

</main>

<!-- ===== FOOTER ===== -->
<footer>
  POS Super Pro © 2025
</footer>

<!-- ===== JS ===== -->
<script src="../assets/js/auth-guard.js"></script>
<script src="../assets/js/reports.js"></script>

</body>
</html>
